<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF8EE">
<title>גוגל ומילות מפתח · ניהול</title>
<link rel="icon" href="/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--honey:#F2B544;--leaf:#5BA36B;--leaf-btn:#3A7548;--leaf-d:#3F7F4F;--cream:#FFF8EE;--cream2:#FBEBD3;--brown:#3B2A20;--brown2:#6E5547;--coral:#F28C7A;--err:#A8382A;
--display:"Rubik","Heebo",Arial,sans-serif;--body:"Heebo","Rubik",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--brown);font-family:var(--body);font-size:15px;max-width:560px;margin:0 auto;padding-bottom:110px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--cream2);padding:10px 16px;display:flex;align-items:center;gap:10px}
.top img{width:42px;height:42px;border-radius:50%}
.top b{font-family:var(--display);font-weight:900;font-size:17px;display:block;line-height:1.1}
.top small{color:var(--leaf-d);font-size:12px;font-weight:500}
.top .sp{flex:1}
.ib{border:1.5px solid var(--cream2);background:#fff;border-radius:99px;padding:6px 12px;font-family:var(--display);font-weight:700;font-size:13px;text-decoration:none;color:var(--brown)}
h3.sec{font-family:var(--display);font-weight:900;font-size:17px;margin:20px 16px 8px}
.hint{margin:0 16px 8px;font-size:13px;color:var(--brown2);line-height:1.5}
.banner{margin:12px 16px 0;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.5;background:#FFF4D6;border:1.5px dashed var(--honey)}
.card{margin:0 16px 10px;background:#fff;border-radius:16px;padding:14px;border:1.5px solid var(--cream2);display:flex;flex-direction:column;gap:10px}
label.f{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:4px}
label.f input,label.f textarea{border:1.5px solid var(--cream2);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:400;width:100%;background:#fff}
label.f textarea{min-height:120px;line-height:1.5;resize:vertical}
.cnt{font-size:12px;font-weight:500;color:var(--brown2)}.cnt.long{color:var(--err)}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 6px 5px 10px;font-size:13.5px;font-weight:700;border:1.5px solid}
.kw.ok{background:#E8F4EB;border-color:#BFE0C7;color:#2E6A3E}
.kw.no{background:#FFF4D6;border-color:var(--honey);color:#7A5410}
.kw button{border:none;background:rgba(0,0,0,.08);border-radius:50%;width:22px;height:22px;font-size:12px;line-height:1;padding:0}
.kwadd{display:flex;gap:8px}
.kwadd input{flex:1;border:1.5px solid var(--cream2);border-radius:12px;padding:10px 12px;font-size:16px}
.btn{border:none;border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:15px;background:var(--leaf-btn);color:#fff}
.legend{font-size:12.5px;color:var(--brown2)}
.where{font-size:12.5px;color:var(--brown2);margin-top:-4px}
details.pg{margin:0 16px 10px;background:#fff;border-radius:16px;border:1.5px solid var(--cream2)}
details.pg summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:15.5px}
details.pg summary::-webkit-details-marker{display:none}
details.pg summary .sp{flex:1}
details.pg .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.st.on{background:var(--leaf);color:#fff}.st.off{background:#ECE6DF;color:var(--brown2)}
.sw{display:flex;align-items:center;gap:10px;font-weight:700}
.sw input{width:22px;height:22px;accent-color:var(--leaf-btn)}
.gp{border:1px solid #e4e4e4;border-radius:12px;padding:10px 12px;background:#fff;font-family:Arial,sans-serif}
.gp .u{font-size:12px;color:#4d5156;direction:ltr;text-align:right}
.gp .t{font-size:17px;color:#1a0dab;line-height:1.3;margin:2px 0}
.gp .d{font-size:13px;color:#4d5156;line-height:1.45}
.gpl{font-size:12px;font-weight:700;color:var(--brown2)}
.save{position:fixed;bottom:0;left:0;right:0;background:rgba(255,248,238,.96);border-top:1px solid var(--cream2);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.save .in{max-width:528px;margin:0 auto;display:flex;gap:8px}
.save .btn{flex:1;font-size:17px;padding:14px}
.save .btn[disabled]{opacity:.5}
.link{background:none;border:none;color:var(--leaf-d);font-weight:700;text-decoration:underline;padding:0;font-size:13.5px}
.todo{margin:0 16px 10px;background:#fff;border-radius:16px;padding:12px 14px;border:1.5px solid var(--cream2);font-size:14px;line-height:1.55}
.todo ol{margin:4px 0 0;padding-inline-start:20px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.center{text-align:center;padding:60px 16px}
</style>
</head>
<body>
<div id="app"><p class="center">טוען…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let KEY="";try{KEY=JSON.parse(localStorage.getItem("noya_admkey")||'""');}catch(e){}
const G={seo:null,defaults:null,db:true,dirty:false,open:{}};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400);}
async function api(method,body){const r=await fetch("/api/seo",{method,headers:{"Content-Type":"application/json","X-Admin-Key":KEY},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json();}catch(e){}return {status:r.status,...j};}

/* where does each keyword appear? every word of the keyword must appear in the same page */
const norm=s=>String(s||"").toLowerCase().replace(/[׳`’']/g,"'").replace(/[״"]/g,'"');
function pageTexts(){const s=G.seo,out=[{name:"דף הבית",t:norm([s.home.title,s.home.desc,s.home.text].join(" "))}];
  Object.values(s.pages).forEach(p=>{if(p.on)out.push({name:p.label,t:norm([p.title,p.desc,p.h1,p.text].join(" "))});});return out;}
function whereIs(kw){const w=norm(kw).split(/\s+/).filter(Boolean);return pageTexts().filter(p=>w.every(x=>p.t.includes(x))).map(p=>p.name);}

function field(path,label,val,kind,max){
  const n=String(val||"").length,long=max&&n>max;
  const inp=kind==="area"?`<textarea data-f="${path}" rows="8">${esc(val)}</textarea>`:`<input data-f="${path}" value="${esc(val)}">`;
  return `<label class="f">${label}${max?` <span class="cnt${long?" long":""}" data-cnt="${path}">${n} תווים${long?" · גוגל יקצר אחרי בערך "+max:""}</span>`:""}${inp}</label>`;
}
function gPreview(url,t,d){return `<div><div class="gpl">ככה זה ייראה בגוגל (בערך):</div><div class="gp"><div class="u">${esc(url)}</div><div class="t">${esc(t)}</div><div class="d">${esc(d)}</div></div></div>`;}

function render(){
  const s=G.seo,host=location.host;
  const kws=s.keywords.map((k,i)=>{const w=whereIs(k);return `<span class="kw ${w.length?"ok":"no"}" title="${esc(w.length?"מופיע ב: "+w.join(", "):"עוד לא מופיע באתר")}">${w.length?"✓":"⚠️"} ${esc(k)}<button data-delkw="${i}" aria-label="מחיקת ${esc(k)}">✕</button></span>`;}).join("");
  const missing=s.keywords.filter(k=>!whereIs(k).length);
  const pages=Object.entries(s.pages).map(([k,p])=>`<details class="pg" data-pg="${k}"${G.open[k]?" open":""}><summary><span>${esc(p.label)}</span><span class="sp"></span><span class="st ${p.on?"on":"off"}">${p.on?"פעיל":"כבוי"}</span><span aria-hidden="true">▾</span></summary><div class="in">
    <label class="sw"><input type="checkbox" data-on="${k}"${p.on?" checked":""}> העמוד מופיע באתר ובגוגל</label>
    ${gPreview(host+"/gluten-free/"+k,p.title,p.desc)}
    ${field(`pages.${k}.title`,"כותרת בגוגל",p.title,"",65)}
    ${field(`pages.${k}.desc`,"תיאור בגוגל",p.desc,"",160)}
    ${field(`pages.${k}.h1`,"כותרת גדולה בעמוד",p.h1)}
    ${field(`pages.${k}.text`,"הטקסט בעמוד",p.text,"area")}
    <div class="legend">שורה ריקה = פסקה חדשה · שורה שמתחילה ב־"## " = כותרת קטנה · שורה שמתחילה ב־"- " = נקודה ברשימה</div>
    ${p.on?`<a class="link" href="/gluten-free/${k}" target="_blank" rel="noopener">לצפייה בעמוד (אחרי שמירה) ↗</a>`:""}
  </div></details>`).join("");
  $("#app").innerHTML=`<header class="top"><img src="/img/logo.jpg" alt=""><div><b>🔎 גוגל ומילות מפתח</b><small>העגלה של נויה</small></div><span class="sp"></span><a class="ib" href="/admin.html">→ להזמנות</a></header>
  ${G.db?"":`<div class="banner">השמירה לא מחוברת כרגע, אפשר לצפות אבל לא לשמור.</div>`}
  <h3 class="sec">מילות המפתח שלנו</h3>
  <p class="hint">✓ ירוק = המילים כבר כתובות באתר. ⚠️ צהוב = עוד לא כתובות באף עמוד. כדי שגוגל יקשר אותנו למילה, צריך לכתוב אותה בטקסט של אחד העמודים למטה, בצורה טבעית. רשימה בלבד לא מספיקה.</p>
  <div class="card"><div class="kws">${kws}</div>
   <form class="kwadd" id="kwf"><input id="kwi" placeholder="מילת מפתח חדשה, למשל: עוגיות ללא גלוטן קיסריה" autocomplete="off"><button class="btn" type="submit">הוספה</button></form>
   ${missing.length?`<div class="where">⚠️ ${missing.length} מילים עוד לא באתר: ${esc(missing.join(" · "))}</div>`:`<div class="where">כל המילים כבר מופיעות באתר 👍</div>`}</div>

  <h3 class="sec">דף הבית</h3>
  <div class="card">${gPreview(host,s.home.title,s.home.desc)}
   ${field("home.title","כותרת בגוגל",s.home.title,"",65)}
   ${field("home.desc","תיאור בגוגל",s.home.desc,"",160)}
   ${field("home.text","פסקה בתחתית דף הבית",s.home.text,"area")}</div>

  <h3 class="sec">עמודים לגוגל</h3>
  <p class="hint">כל עמוד הוא תשובה לחיפוש אחר. "כבוי" = לא מופיע באתר ולא בגוגל. להדליק עגלת קפה ועוגות רק כשהן באמת קיימות.</p>
  ${pages}

  <h3 class="sec">מה עוד מקדם אותנו בגוגל</h3>
  <div class="todo"><ol>
   <li><b>פרופיל עסק בגוגל</b> עם אזור שירות (חדרה, פרדס חנה, קיסריה, בנימינה). זה מכניס אותנו למפה.</li>
   <li><b>ביקורות בגוגל</b> מלקוחות, עם שם המנה והעיר.</li>
   <li><b>Google Search Console</b>: מגישים שם את מפת האתר <span dir="ltr">${esc(location.origin)}/sitemap.xml</span></li>
   <li>רישום באתרי מדריכים (easy, טיולי, עמותת הצליאק) וקבוצות פייסבוק מקומיות.</li>
  </ol></div>
  <p class="hint" style="text-align:center"><button class="link" data-reset>החזרת כל הטקסטים למקור</button></p>
  <div class="save"><div class="in"><button class="btn" id="savebtn" data-save${G.dirty?"":" disabled"}>${G.dirty?"שמירה":"נשמר ✓"}</button></div></div>`;
}
function setPath(path,val){const a=path.split(".");let o=G.seo;while(a.length>1)o=o[a.shift()];o[a[0]]=val;}
function markDirty(){if(!G.dirty){G.dirty=true;const b=$("#savebtn");if(b){b.disabled=false;b.textContent="שמירה";}}}
document.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;setPath(f,e.target.value);markDirty();
  const c=document.querySelector(`[data-cnt="${f}"]`);if(c){const n=e.target.value.length,max=/desc$/.test(f)?160:65;c.textContent=n+" תווים"+(n>max?" · גוגל יקצר אחרי בערך "+max:"");c.classList.toggle("long",n>max);}});
document.addEventListener("change",e=>{const k=e.target.dataset.on;if(!k)return;G.seo.pages[k].on=e.target.checked;G.dirty=true;render();});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.pg;if(k)G.open[k]=e.target.open;},true);
document.addEventListener("submit",e=>{if(e.target.id!=="kwf")return;e.preventDefault();const v=$("#kwi").value.trim();if(!v)return;
  if(G.seo.keywords.some(k=>norm(k)===norm(v))){toast("המילה כבר ברשימה");return;}G.seo.keywords.push(v);G.dirty=true;render();$("#kwi").focus();});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-delkw],[data-save],[data-reset]");if(!t)return;
  if(t.dataset.delkw!==undefined){G.seo.keywords.splice(+t.dataset.delkw,1);G.dirty=true;render();return;}
  if(t.dataset.save!==undefined){t.disabled=true;t.textContent="שומר…";const r=await api("PUT",G.seo).catch(()=>({}));
    if(r.ok){G.seo=r.seo;G.dirty=false;render();toast("נשמר ✓ האתר מתעדכן תוך כמה דקות");}else{t.disabled=false;t.textContent="שמירה";toast(r.status===401?"צריך להתחבר מחדש":"לא נשמר, נסו שוב");}return;}
  if(t.dataset.reset!==undefined){if(!t.dataset.armed){t.dataset.armed="1";t.textContent="בטוח? לחצו שוב";return;}
    const r=await api("DELETE").catch(()=>({}));if(r.ok){G.seo=r.seo;G.dirty=false;render();toast("הוחזר למקור");}else toast("לא הצליח");}
});
window.addEventListener("beforeunload",e=>{if(G.dirty){e.preventDefault();e.returnValue="";}});
(async()=>{
  if(!KEY){$("#app").innerHTML=`<div class="center"><p>צריך להתחבר קודם בדף ההזמנות.</p><a class="btn" style="text-decoration:none;display:inline-block" href="/admin.html">לכניסה</a></div>`;return;}
  const r=await api("GET").catch(()=>({status:0}));
  if(r.status===401){$("#app").innerHTML=`<div class="center"><p>צריך להתחבר מחדש.</p><a class="btn" style="text-decoration:none;display:inline-block" href="/admin.html">לכניסה</a></div>`;return;}
  if(!r.ok){$("#app").innerHTML=`<p class="center">אין חיבור לשרת. נסו לרענן.</p>`;return;}
  G.seo=r.seo;G.defaults=r.defaults;G.db=r.db;render();
})();
</script>
</body>
</html>
